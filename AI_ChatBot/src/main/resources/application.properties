spring.application.name=ai-chatbot
server.port=8081

# ---------------------------------------------------------------- persistence
# H2 file database: the chat history, training data and anything the bot learns
# survive a restart. Swap in application-mysql.properties.example for MySQL.
spring.datasource.url=jdbc:h2:file:./data/ai_chatbot;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------ classifier
# Minimum blended confidence before the bot commits to an answer.
chatbot.confidence-threshold=0.35
# Between this and the threshold above the bot asks a clarifying question
# instead of guessing. Below it, the bot falls back and logs the question.
chatbot.clarify-threshold=0.18

# Ensemble weights. They are normalised at startup, so relative size is what
# matters. Similarity leads because users tend to phrase questions much like
# the training examples; keyword coverage guards against confident nonsense.
chatbot.weights.naive-bayes=0.35
chatbot.weights.similarity=0.45
chatbot.weights.keyword=0.20

# ------------------------------------------------------------------- learning
# A thumbs up on an answer below this confidence adds the user's wording to the
# training data, so weakly recognised phrasings become strong ones.
chatbot.learning.reinforce-below=0.75

# Leave-one-out cross-validation after each training run, on a background
# thread. Set to false on a slow machine or a very large corpus.
chatbot.evaluation.enabled=true

# --------------------------------------------------------------------- logging
logging.level.com.aichatbot=INFO
